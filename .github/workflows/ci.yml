name: C build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        c_compiler: [gcc, clang]

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: >
        cmake -S . -B build
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build
