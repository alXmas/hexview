name: C build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        c_compiler: [gcc, clang]

    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: make build CC=${{ matrix.c_compiler }}
